# /etc/apache2/noc-oidc.conf  (permissão 600 — contém segredos)
# Login OIDC do NOC Horizon. Incluir DENTRO do <VirtualHost *:443>:
#     Include /etc/apache2/noc-oidc.conf
# Requer: apt install libapache2-mod-auth-openidc && a2enmod auth_openidc
#
# Funciona com qualquer provedor OIDC — troque só as 3 primeiras linhas:
#   Google:    https://accounts.google.com/.well-known/openid-configuration
#   Keycloak:  https://SEU-KEYCLOAK/realms/SEU-REALM/.well-known/openid-configuration
#   Azure AD:  https://login.microsoftonline.com/SEU-TENANT/v2.0/.well-known/openid-configuration
OIDCProviderMetadataURL https://accounts.google.com/.well-known/openid-configuration
OIDCClientID COLE_O_CLIENT_ID
OIDCClientSecret COLE_O_CLIENT_SECRET

OIDCRedirectURI https://noc.seu-dominio.com/oidc/callback
# gere com: openssl rand -hex 32
OIDCCryptoPassphrase COLE_UMA_FRASE_ALEATORIA
OIDCScope "openid email profile"
OIDCRemoteUserClaim email
# Repassa e-mail e nome ao backend (/api/me) como cabeçalhos "OIDC-Claim-*".
# O módulo apaga esses cabeçalhos se vierem do navegador.
OIDCClaimPrefix "OIDC-Claim-"
OIDCPassClaimsAs headers
# Sempre mostra o seletor de contas (permite "Entrar com outra conta")
OIDCAuthRequestParams prompt=select_account
# sessão: expira após 8h sem uso e, no máximo, em 24h
OIDCSessionInactivityTimeout 28800
OIDCSessionMaxDuration 86400

# Quem pode ver o painel: um "Require" por pessoa (e-mail em minúsculas).
# Com Keycloak, prefira um papel:  Require claim roles:noc-viewer
<Location />
    AuthType openid-connect
    Require claim email:pessoa1@exemplo.com
    Require claim email:pessoa2@exemplo.com
</Location>

# Na API, sessão expirada responde 401 (o painel recarrega e volta ao login)
<Location /api/>
    OIDCUnAuthAction 401
</Location>

# Páginas públicas: "acesso não autorizado" e "você saiu" (precisam vir DEPOIS do <Location />)
<Location /public/>
    AuthType None
    Require all granted
</Location>
<Location /favicon.svg>
    AuthType None
    Require all granted
</Location>
ErrorDocument 401 /public/acesso-negado.html
ErrorDocument 403 /public/acesso-negado.html
