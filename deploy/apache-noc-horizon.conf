# /etc/apache2/sites-available/noc-horizon.conf
# Requer: a2enmod headers proxy proxy_http
# Para HTTPS de origem, copie este bloco para <VirtualHost *:443> e acrescente
# SSLEngine on / SSLCertificateFile / SSLCertificateKeyFile (ver docs/operacao.md).
<VirtualHost *:80>
    ServerName noc.seu-dominio.com
    # SÓ o frontend — nunca a raiz do repositório
    DocumentRoot /var/www/noc-horizon

    <Directory /var/www/noc-horizon>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "no-referrer"
        <FilesMatch "\.(html|css|js|json)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </Directory>

    # nunca servir arquivos ocultos (.git, .env ...)
    <LocationMatch "/\.(?!well-known)">
        Require all denied
    </LocationMatch>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:5004/api/ timeout=20
    ProxyPassReverse /api/ http://127.0.0.1:5004/api/
    <Location /api/>
        Header always set Cache-Control "no-store"
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/noc-horizon-error.log
    CustomLog ${APACHE_LOG_DIR}/noc-horizon-access.log combined
</VirtualHost>
