server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança (mesmos da produção com Apache)
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;

    # Nunca servir arquivos ocultos
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # API -> container do backend
    location /api/ {
        proxy_pass http://api:5004/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
}
